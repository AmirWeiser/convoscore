<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}ConvoScore{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #ddd; }
    a { color: #0b5fff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .status { padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.85em; }
    .status-pending { background: #fff3cd; }
    .status-processing { background: #cfe2ff; }
    .status-completed { background: #d1e7dd; }
    .status-failed { background: #f8d7da; }
    .field { margin-bottom: 0.75rem; }
    .field dt { font-weight: 600; font-size: 0.85em; color: #555; }
    .field dd { margin: 0.15rem 0 0; }
    pre { background: #f5f5f5; padding: 0.75rem; overflow-x: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <p><a href="/conversations">&larr; All conversations</a></p>
  {% block content %}{% endblock %}
</body>
</html>
