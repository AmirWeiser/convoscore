apiVersion: v1
kind: Service
metadata:
  name: convoscore-api
  labels:
    {{- include "convoscore.labels" (dict "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "convoscore.labels" (dict "component" "api") | nindent 4 }}
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
