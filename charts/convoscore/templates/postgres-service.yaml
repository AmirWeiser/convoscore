apiVersion: v1
kind: Service
metadata:
  name: convoscore-postgres
  labels:
    {{- include "convoscore.labels" (dict "component" "postgres") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "convoscore.labels" (dict "component" "postgres") | nindent 4 }}
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
