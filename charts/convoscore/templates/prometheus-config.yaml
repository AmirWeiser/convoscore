apiVersion: v1
kind: ConfigMap
metadata:
  name: convoscore-prometheus-config
  labels:
    {{- include "convoscore.labels" (dict "component" "prometheus") | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: convoscore-api
        metrics_path: /metrics
        static_configs:
          - targets: ["convoscore-api:{{ .Values.api.port }}"]
      - job_name: convoscore-worker
        metrics_path: /metrics
        static_configs:
          - targets: ["convoscore-worker-metrics:{{ .Values.worker.metricsPort }}"]
  # Evaluated by this Prometheus itself and visible under /alerts - no
  # Alertmanager is deployed (out of scope for this take-home, see
  # DECISIONS.md), so nothing routes/pages on these, but a stale worker poll
  # loop or DLQ collector is visible here and on the Grafana dashboard
  # instead of looking identical to "healthy and idle".
  alerts.yml: |
    groups:
      - name: convoscore
        rules:
          - alert: ConvoScoreWorkerPollStale
            expr: time() - convoscore_worker_last_poll_timestamp_seconds > 120
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "ConvoScore worker has not completed a poll cycle in over 2 minutes"
          - alert: ConvoScoreDlqCollectorStale
            expr: time() - convoscore_dlq_collector_last_success_timestamp_seconds > 180
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "ConvoScore DLQ-depth collector has not succeeded in over 3 minutes - convoscore_dlq_depth may be stale, not actually zero"
